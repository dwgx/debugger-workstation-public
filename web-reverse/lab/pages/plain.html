<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lab target — readable signer</title>
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 2rem; max-width: 46rem; }
  button { font: inherit; padding: .4rem .9rem; }
  pre { background: #f4f4f4; padding: .75rem; overflow: auto; }
  .hint { color: #666; }
</style>
</head>
<body>
<h1>lab target — readable signer</h1>
<p class="hint">Signed request, HMAC-SHA256 over <code>ts + "." + body</code>. Source is deliberately readable:
this page is the reference the obfuscated variant at <a href="/obf">/obf</a> is compared against.</p>

<p><button id="go">Sign and POST to /api/submit</button></p>
<pre id="out">idle</pre>

<script src="/js/sha256-pure.js"></script>
<script>
/* The operator's signing key, shipped to the client exactly the way real
   client-signed APIs do it. Lab constant, not a credential. */
const LAB_KEY = 'lab-demo-signing-key-9f2c1a7e-not-a-real-secret-v1';
const ENDPOINT = '/api/submit';

function buildBody() {
  return JSON.stringify({
    op: 'lab.submit',
    nonce: Math.random().toString(36).slice(2, 10),
    at: Date.now()
  });
}

/* The signing step. Everything an analyst needs is this one line plus the key. */
function sign(body, ts) {
  return LabCrypto.hmacSha256Hex(LAB_KEY, ts + '.' + body);
}

function submit() {
  const body = buildBody();
  const ts = String(Date.now());
  const signature = sign(body, ts);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', ENDPOINT, true);
  xhr.setRequestHeader('content-type', 'application/json');
  xhr.setRequestHeader('x-lab-ts', ts);
  xhr.setRequestHeader('x-lab-sign', signature);
  xhr.onload = function () {
    document.getElementById('out').textContent =
      'HTTP ' + xhr.status + '\n' +
      'sent     ts=' + ts + ' sign=' + signature + '\n' +
      'body     ' + body + '\n' +
      'response ' + xhr.responseText;
  };
  xhr.send(body);
}

document.getElementById('go').addEventListener('click', submit);
window.labSign = sign;           // small convenience for driving from a console/CDP
window.labSubmit = submit;
</script>
</body>
</html>
